<!doctype html>
<html lang="tr"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0d1016"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="Korkmaz Harita">
<link rel="apple-touch-icon" href="icon-s.png"><link rel="manifest" href="manifest.json"><title>Korkmaz Harita Mühendislik</title>
<style>
*{box-sizing:border-box}html,body{margin:0;background:#0d1016;color:#f7f7f8;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display",Arial,sans-serif}body{min-height:100vh}.hidden{display:none!important}.app{max-width:600px;margin:auto;min-height:100vh;padding:env(safe-area-inset-top) 16px calc(90px + env(safe-area-inset-bottom));position:relative;overflow:hidden}.splash{position:fixed;inset:0;background:#fff;z-index:1000;display:flex;align-items:center;justify-content:center;transition:opacity .35s}.splash-bg{position:absolute;inset:0;opacity:.12;background-image:linear-gradient(35deg,transparent 46%,#b28a35 47%,#b28a35 48%,transparent 49%),linear-gradient(-35deg,transparent 46%,#b28a35 47%,#b28a35 48%,transparent 49%);background-size:90px 90px}.survey{position:absolute;inset:0;pointer-events:none;color:#b28a35;opacity:.16}.survey span{position:absolute;font-size:52px}.survey .a{left:7%;top:12%}.survey .b{right:8%;top:28%}.survey .c{left:12%;bottom:18%}.survey .d{right:12%;bottom:12%}.splash-content{position:relative;text-align:center}.splash-logo{width:180px;height:180px;object-fit:contain;animation:blink 1.05s ease-in-out infinite}.splash h1{color:#171717;font-size:24px;margin:6px 0 3px}.splash p{color:#555;margin:0;font-size:13px}@keyframes blink{0%,100%{opacity:.35;transform:scale(.97)}50%{opacity:1;transform:scale(1)}}header{text-align:center;padding:26px 0 14px}.logo-full{width:170px;max-height:115px;object-fit:contain}h1{font-size:21px;margin:7px 0 2px}.sub{margin:0;color:#9fa6b2;font-size:13px}.card{background:#171b23;border:1px solid #2a303a;border-radius:19px;padding:15px;margin:11px 0;box-shadow:0 8px 25px rgba(0,0,0,.12)}.section-title{font-size:15px;font-weight:800;margin-bottom:5px}label{display:block;color:#b8bec8;font-size:12px;margin:9px 0 5px}.optional{color:#777f8d;font-weight:500}input,select{width:100%;padding:13px 12px;border-radius:12px;border:1px solid #353c49;background:#0f1218;color:#fff;font-size:16px;outline:none}input:focus,select:focus{border-color:#c59b48}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}.btn{border:0;border-radius:13px;padding:14px;font-size:15px;font-weight:800;background:#d6aa51;color:#111;margin-top:10px;width:100%}.btn.secondary{background:#2a303b;color:#fff}.btn.danger{background:#51262a;color:#fff}.result{font-size:30px;font-weight:900;text-align:center;margin:15px 0 6px}.hint{font-size:12px;color:#8f97a5;line-height:1.4}.error{color:#ff8e8e;background:#351c20;border:1px solid #613038;border-radius:11px;padding:10px;font-size:13px;margin-top:10px}.history{max-height:430px;overflow:auto}.item{padding:13px 0;border-bottom:1px solid #292f39}.item:last-child{border-bottom:0}.item-head{display:flex;justify-content:space-between;gap:8px}.amount{font-weight:900}.muted{color:#8f97a5;font-size:12px}.small{font-size:12px;color:#b4bac4;line-height:1.6}.actions{display:flex;gap:7px;margin-top:8px}.actions button{flex:1;margin:0;padding:9px;font-size:12px}.search{margin:10px 0}.admin-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.modal{position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:900;display:flex;align-items:flex-end;justify-content:center}.modal-box{width:min(600px,100%);max-height:88vh;overflow:auto;background:#171b23;border-radius:24px 24px 0 0;padding:18px 16px calc(25px + env(safe-area-inset-bottom));border:1px solid #303641}.modal-head{display:flex;justify-content:space-between;align-items:center}.close{background:#2a303b;border:0;color:white;border-radius:10px;padding:8px 12px}.service-row{display:grid;grid-template-columns:1.5fr 1fr auto;gap:7px;margin-top:8px}.service-row button{margin:0}.bottom-settings{position:fixed;left:16px;bottom:calc(16px + env(safe-area-inset-bottom));z-index:20;width:48px;height:48px;border-radius:50%;border:1px solid #3b424d;background:#171b23;color:#fff;font-size:21px;box-shadow:0 8px 25px rgba(0,0,0,.35)}
</style></head><body>
<div id="splash" class="splash"><div class="splash-bg"></div><div class="survey"><span class="a">◎</span><span class="b">⌖</span><span class="c">▱</span><span class="d">△</span></div><div class="splash-content"><img class="splash-logo" src="logo.png"><h1>Korkmaz Harita Mühendislik</h1><p>Fiyat Hesaplama</p></div></div>
<div class="app"><header><img class="logo-full" src="logo.png"><h1>Korkmaz Harita Mühendislik</h1><p class="sub">Fiyat Hesaplama</p></header>
<div class="card"><div class="section-title">Müşteri Bilgileri <span class="optional">(isteğe bağlı)</span></div><div class="row"><div><label>Ad</label><input id="firstName"></div><div><label>Soyad</label><input id="lastName"></div></div><label>Telefon</label><input id="phone" type="tel" inputmode="tel" placeholder="05xx xxx xx xx"><div class="row"><div><label>İl</label><input id="city"></div><div><label>İlçe</label><input id="district"></div></div><label>Mahalle</label><input id="neighborhood"></div>
<div class="card"><div class="section-title">İş Bilgileri</div><label>Hizmet</label><select id="service"></select><div class="row"><div><label>Kilometre <b>*</b></label><input id="km" type="number" inputmode="decimal" min="0"></div><div><label>Koordinat sayısı <b>*</b></label><input id="coord" type="number" inputmode="numeric" min="0"></div></div><div class="row"><div><label>Ada <b>*</b></label><input id="ada"></div><div><label>Parsel <b>*</b></label><input id="parsel"></div></div><label>Alan (m²) <b>*</b></label><input id="area" type="number" inputmode="decimal" min="0"><div id="error" class="error hidden"></div><button class="btn" onclick="calc()">HESAPLA</button><div class="result" id="result">0 TL</div><button class="btn secondary" onclick="saveRecord()">KAYDET</button></div>
<div class="card"><div class="section-title">Kayıt Geçmişi</div><input class="search" id="search" placeholder="Ad, soyad veya telefon ile ara" oninput="renderHistory()"><div class="history" id="history"></div></div>
</div><button class="bottom-settings" onclick="openSettings()" aria-label="Ayarlar">⚙️</button>
<div id="settingsModal" class="modal hidden"><div class="modal-box"><div class="modal-head"><h2 style="margin:0">Yönetici Ayarları</h2><button class="close" onclick="closeSettings()">Kapat</button></div><label>PIN</label><input id="pin" type="password" inputmode="numeric" placeholder="PIN"><button class="btn secondary" onclick="unlock()">Ayarları Aç</button><div id="adminPanel" class="hidden"><div class="card"><div class="section-title">Fiyat Tarifesi</div><div class="admin-grid"><div><label>Sabit ücret</label><input id="base" type="number"></div><div><label>Km ücreti</label><input id="kmPrice" type="number"></div><div><label>Koordinat ücreti</label><input id="coordPrice" type="number"></div><div><label>Her 1000 m²</label><input id="areaPrice" type="number"></div></div><button class="btn" onclick="saveSettings()">AYARLARI KAYDET</button></div><div class="card"><div class="section-title">Hizmetler</div><div id="services"></div><div class="service-row"><input id="newService" placeholder="Yeni hizmet adı"><input id="newServicePrice" type="number" placeholder="Ek ücret"><button class="btn secondary" onclick="addService()">Ekle</button></div></div><div class="card"><div class="section-title">PIN</div><input id="newPin" type="password" inputmode="numeric" placeholder="Yeni PIN"><button class="btn secondary" onclick="changePin()">PIN DEĞİŞTİR</button></div></div></div></div>
<script>
const defaults={base:1500,kmPrice:5,coordPrice:50,areaPrice:200,pin:"4296",services:[{name:"Genel Ölçüm",extra:0}]};
let s=JSON.parse(localStorage.getItem("kh_settings")||"null")||defaults;s.services=s.services||defaults.services;let editingId=null;
const $=id=>document.getElementById(id);const val=id=>parseFloat($(id).value);function required(){return ["km","coord","ada","parsel","area"].every(id=>String($(id).value).trim()!=="")}
function calc(){if(!required()){ $("error").textContent="Lütfen yıldız (*) bulunan tüm zorunlu alanları doldurun. Eksik bilgi varken fiyat verilmez.";$("error").classList.remove("hidden");$("result").textContent="—";return null}$("error").classList.add("hidden");const area=val("area"),svc=s.services.find(x=>x.name===$("service").value)||s.services[0],total=s.base+val("km")*s.kmPrice+val("coord")*s.coordPrice+Math.ceil(area/1000)*s.areaPrice+(svc?.extra||0);$("result").textContent=total.toLocaleString("tr-TR")+" TL";return total}
function saveRecord(){const total=calc();if(total===null)return;const rec={id:Date.now(),date:new Date().toLocaleString("tr-TR"),firstName:firstName.value,lastName:lastName.value,phone:phone.value,city:city.value,district:district.value,neighborhood:neighborhood.value,service:service.value,km:val("km"),coord:val("coord"),ada:ada.value,parsel:parsel.value,area:val("area"),total};let a=JSON.parse(localStorage.getItem("kh_history")||"[]");if(editingId){a=a.map(x=>x.id===editingId?rec:x);editingId=null}else a.unshift(rec);localStorage.setItem("kh_history",JSON.stringify(a));renderHistory();alert("Kayıt kaydedildi.");}
function renderHistory(){const q=$("search").value.toLocaleLowerCase("tr-TR").trim(),a=JSON.parse(localStorage.getItem("kh_history")||"[]").filter(r=>(r.firstName+" "+r.lastName+" "+r.phone).toLocaleLowerCase("tr-TR").includes(q));$("history").innerHTML=a.length?a.map(r=>`<div class="item"><div class="item-head"><span class="amount">${r.total.toLocaleString("tr-TR")} TL</span><span class="muted">${r.date}</span></div><div class="small"><b>${[r.firstName,r.lastName].filter(Boolean).join(" ")||"İsimsiz müşteri"}</b>${r.phone?" · "+r.phone:""}<br>${r.city||r.district||r.neighborhood?[r.city,r.district,r.neighborhood].filter(Boolean).join(" / "):""}${r.city||r.district||r.neighborhood?"<br>":""}${r.service} · Ada/Parsel ${r.ada}/${r.parsel} · ${r.area} m² · ${r.km} km · ${r.coord} koordinat</div><div class="actions"><button class="btn secondary" onclick="editRecord(${r.id})">DÜZENLE</button><button class="btn danger" onclick="deleteRecord(${r.id})">SİL</button></div></div>`).join(""):"<p class='muted'>Kayıt bulunamadı.</p>"}
function editRecord(id){const r=JSON.parse(localStorage.getItem("kh_history")||"[]").find(x=>x.id===id);if(!r)return;editingId=id;["firstName","lastName","phone","city","district","neighborhood","service","km","coord","ada","parsel","area"].forEach(k=>$(k).value=r[k]??"");calc();scrollTo({top:0,behavior:"smooth"})}
function deleteRecord(id){if(!confirm("Bu kayıt silinsin mi?"))return;let a=JSON.parse(localStorage.getItem("kh_history")||"[]").filter(x=>x.id!==id);localStorage.setItem("kh_history",JSON.stringify(a));renderHistory()}
function openSettings(){$("settingsModal").classList.remove("hidden");$("pin").value="";$("adminPanel").classList.add("hidden")};function closeSettings(){$("settingsModal").classList.add("hidden")};function unlock(){if($("pin").value===s.pin){$("adminPanel").classList.remove("hidden");$("base").value=s.base;$("kmPrice").value=s.kmPrice;$("coordPrice").value=s.coordPrice;$("areaPrice").value=s.areaPrice;renderServices()}else alert("PIN yanlış.")}
function saveSettings(){s={...s,base:Number($("base").value)||0,kmPrice:Number($("kmPrice").value)||0,coordPrice:Number($("coordPrice").value)||0,areaPrice:Number($("areaPrice").value)||0};localStorage.setItem("kh_settings",JSON.stringify(s));fillServices();alert("Ayarlar kaydedildi.")}
function changePin(){const p=$("newPin").value.trim();if(p.length<4)return alert("PIN en az 4 haneli olsun.");s.pin=p;localStorage.setItem("kh_settings",JSON.stringify(s));$("newPin").value="";alert("PIN değiştirildi.")}
function renderServices(){$("services").innerHTML=s.services.map((x,i)=>`<div class="service-row"><input value="${x.name.replaceAll('"','&quot;')}" onchange="renameService(${i},this.value)"><input type="number" value="${x.extra}" onchange="priceService(${i},this.value)"><button class="btn danger" onclick="removeService(${i})">Sil</button></div>`).join("")}
function renameService(i,v){if(!v.trim())return; s.services[i].name=v.trim();localStorage.setItem("kh_settings",JSON.stringify(s));fillServices();renderServices()};function priceService(i,v){s.services[i].extra=Number(v)||0;localStorage.setItem("kh_settings",JSON.stringify(s));fillServices()};function addService(){const n=$("newService").value.trim();if(!n)return alert("Hizmet adı yazın.");s.services.push({name:n,extra:Number($("newServicePrice").value)||0});localStorage.setItem("kh_settings",JSON.stringify(s));$("newService").value="";$("newServicePrice").value="";renderServices();fillServices()};function removeService(i){if(s.services.length<=1)return alert("En az bir hizmet kalmalı.");s.services.splice(i,1);localStorage.setItem("kh_settings",JSON.stringify(s));renderServices();fillServices()};function fillServices(){$("service").innerHTML=s.services.map(x=>`<option>${x.name}</option>`).join("")}
fillServices();renderHistory();setTimeout(()=>{$("splash").style.opacity="0";setTimeout(()=>$("splash").remove(),400)},2600);
</script></body></html>
